<!doctype html><meta charset="utf-8">
<!-- oraimo SpaceBuds 2 pitch, storyboard frames (16:9). One frame per ?b=N. -->
<style>
@font-face{font-family:D;font-weight:500;src:url(../assets/InterDisplay-Medium.otf)}
@font-face{font-family:D;font-weight:700;src:url(../assets/InterDisplay-SemiBold.otf)}
@font-face{font-family:D;font-weight:900;src:url(../assets/InterDisplay-Bold.otf)}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:D,sans-serif;background:#050606;color:#fff;position:relative}
.f{position:absolute;inset:0;display:none}.abs{position:absolute}
.lime{color:#82E600}.big{font-weight:900;letter-spacing:-.045em;line-height:.92}
.ph{position:absolute;border-radius:36px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;font:700 30px/1 D;padding:14px 26px;border-radius:999px;background:rgba(130,230,0,.12);color:#82E600;border:2px solid rgba(130,230,0,.5);white-space:nowrap}
.spec{position:absolute;font:700 34px/1.15 D;color:#fff;white-space:nowrap}.spec span{display:block;font:500 24px/1.4 D;color:#8E9496}
.spec:before{content:"";position:absolute;left:-150px;top:18px;width:130px;height:2px;background:linear-gradient(90deg,rgba(130,230,0,0),#82E600)}
</style>
<body>
<!-- 1 hook: Lagos noise, each moment throws a jagged wave -->
<div class="f" id="b1">
  <div class="ph" style="left:120px;top:190px;width:560px;height:380px;transform:rotate(-4deg)"><img src="../assets/l4.jpg"></div>
  <div class="ph" style="left:720px;top:140px;width:480px;height:340px;transform:rotate(3deg)"><img src="../assets/l1.jpg"></div>
  <div class="ph" style="left:1250px;top:200px;width:540px;height:380px;transform:rotate(-2deg)"><img src="../assets/l6.jpg"></div>
  <svg class="abs" style="left:0;top:0" width="1920" height="1080">
    <path d="M0 700 L80 640 L130 760 L190 600 L250 780 L310 620 L360 740 L430 560 L490 800 L560 640 L620 720 L700 590 L770 790 L840 650 L900 720 L980 580 L1040 780 L1110 630 L1180 750 L1250 600 L1320 770 L1390 640 L1460 730 L1530 590 L1600 790 L1680 650 L1760 720 L1840 610 L1920 700" fill="none" stroke="#F5B400" stroke-width="7" stroke-linejoin="round" opacity=".95"/>
    <path d="M0 720 L70 680 L140 790 L200 650 L270 760 L330 680 L400 800 L460 660 L540 760 L600 690 L680 800 L740 660 L810 770 L880 690 L950 790 L1020 660 L1090 760 L1160 680 L1230 790 L1300 660 L1370 760 L1440 690 L1520 800 L1590 670 L1660 760 L1740 680 L1820 780 L1920 690" fill="none" stroke="#FF3B30" stroke-width="6" stroke-linejoin="round" opacity=".8"/>
    <path d="M0 690 L90 760 L160 640 L230 740 L300 660 L370 770 L440 640 L520 750 L590 670 L660 760 L740 640 L820 760 L890 660 L960 750 L1040 650 L1110 770 L1190 660 L1260 740 L1340 640 L1410 760 L1490 660 L1570 750 L1650 640 L1730 760 L1810 660 L1920 730" fill="none" stroke="#3D8BFF" stroke-width="5" stroke-linejoin="round" opacity=".75"/>
  </svg>
  <div class="abs big" style="left:0;width:1920px;text-align:center;top:840px;font-size:150px">Lagos is loud.</div>
</div>
<!-- 2 the turn: the case opens, its ring glows, a lime bloom swallows the noise -->
<div class="f" id="b2">
  <div class="abs" style="left:310px;top:-150px;width:1300px;height:1300px;border-radius:50%;background:radial-gradient(closest-side,rgba(130,230,0,.38),rgba(130,230,0,.08) 55%,rgba(130,230,0,0))"></div>
  <svg class="abs" style="left:0;top:0" width="1920" height="1080"><path d="M0 760 L120 700 L200 790 L290 680 L370 770 L440 720" fill="none" stroke="#F5B400" stroke-width="6" opacity=".5"/><path d="M1480 720 L1560 780 L1650 690 L1740 770 L1830 700 L1920 760" fill="none" stroke="#FF3B30" stroke-width="6" opacity=".45"/></svg>
  <img src="../assets/buds_case.png" class="abs" style="left:610px;top:150px;width:700px;filter:drop-shadow(0 40px 80px rgba(0,0,0,.6))">
</div>
<!-- 3 silence: every wave collapses into one calm lime line -->
<div class="f" id="b3">
  <svg class="abs" style="left:0;top:0" width="1920" height="1080"><defs><filter id="g"><feGaussianBlur stdDeviation="8"/></filter></defs>
    <path d="M0 560 C480 560 700 556 960 556 S1440 560 1920 560" fill="none" stroke="#82E600" stroke-width="10" filter="url(#g)" opacity=".7"/>
    <path d="M0 560 C480 560 700 556 960 556 S1440 560 1920 560" fill="none" stroke="#B6FF4D" stroke-width="4"/></svg>
  <div class="abs big" style="left:0;width:1920px;text-align:center;top:360px;font-size:150px">Noise <span class="lime">off.</span></div>
</div>
<!-- 4 proof: 52dB, the earbud turns in 3D with real features labelled -->
<div class="f" id="b4">
  <div class="abs" style="left:-200px;top:200px;width:1100px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(130,230,0,.16),rgba(130,230,0,0))"></div>
  <div class="abs big lime" style="left:120px;top:250px;font-size:330px">52dB</div>
  <div class="abs" style="left:130px;top:600px;font:700 60px/1.15 D">Hybrid Active<br>Noise Cancellation</div>
  <img src="../assets/buds_case.png" class="abs" style="left:880px;top:220px;width:600px;filter:drop-shadow(0 40px 80px rgba(0,0,0,.7))">
  <div class="spec" style="left:1600px;top:330px">52dB ANC<span>Hybrid noise cancelling</span></div>
  <div class="spec" style="left:1600px;top:650px">Deep low end<span>Big-speaker bass</span></div>
</div>
<!-- 5 space on: the listener in his own space, the city blurs past behind -->
<div class="f" id="b5">
  <div class="abs" style="inset:-40px;background:url(../assets/l6.jpg) center/cover;filter:blur(22px) brightness(.45) saturate(.8)"></div>
  <div class="abs" style="inset:0;background:radial-gradient(60% 70% at 70% 50%,rgba(0,0,0,0),rgba(5,6,6,.85))"></div>
  <div class="ph" style="left:1040px;top:150px;width:760px;height:780px;box-shadow:0 0 0 3px rgba(130,230,0,.55),0 0 90px rgba(130,230,0,.25),0 40px 120px rgba(0,0,0,.7)"><img src="../assets/l5.jpg" style="object-position:30% 50%"></div>
  <div class="abs big" style="left:140px;top:380px;font-size:150px">Space <span class="lime">on.</span></div>
  <div class="abs" style="left:146px;top:560px;font:500 46px/1.3 D;color:#C9CDCF">The city keeps going.<br>You don't have to hear it.</div>
</div>
<!-- 6 close -->
<div class="f" id="b6">
  <div class="abs" style="left:560px;top:120px;width:800px;height:800px;border-radius:50%;background:radial-gradient(closest-side,rgba(130,230,0,.18),rgba(130,230,0,0))"></div>
  <img src="../assets/buds_case.png" class="abs" style="left:790px;top:150px;width:340px">
  <div class="abs" style="left:0;width:1920px;text-align:center;top:520px;font:700 54px/1 D">SpaceBuds 2</div>
  <div class="abs" style="left:0;width:1920px;text-align:center;top:600px;font:500 40px/1 D;color:#8E9496">Noise Off, Space On</div>
  <img src="../assets/logo_lime.png" class="abs" style="left:780px;top:760px;width:360px">
</div>
<script>document.getElementById('b'+(new URLSearchParams(location.search).get('b')||1)).style.display='block'</script>
