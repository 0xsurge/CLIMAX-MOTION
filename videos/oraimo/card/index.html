<!doctype html>
<meta charset="utf-8">
<title>oraimo SpaceBuds Neo+ product card</title>
<!-- A reverse-engineering of the "Apple Store" product-card animation (videos/reference/apple-store-ref, measured at 30 fps)
     for oraimo SpaceBuds Neo+. 1080x1080, 8.6 s, pure function of t. One continuous carrier, no cuts, no camera:
       0.0-1.0  the lime dot of oraimo assembles from flying fragments
       1.0-1.6  the oraimo wordmark builds letter by letter, small bars wiping off each letter
       1.6-2.45 a cluster of the product flies in and gathers, turning (3D case and buds + oraimo's renders)
       2.45-3.0 the cluster collapses into a small white card; the card grows into the product card (name, dropdown)
       3.75 / 4.31 / 4.85 / 5.38 / 5.92  the card floods with a new colour and the case turns: one oraimo truth per colour
       6.43-7.5 the card widens into a spec sheet with a Buy pill
       7.5-8.6  it folds back to the card, which shrinks to a lime dot -->
<style>
@font-face{font-family:D;font-weight:500;src:url(../assets/InterDisplay-Medium.otf)}
@font-face{font-family:D;font-weight:700;src:url(../assets/InterDisplay-SemiBold.otf)}
@font-face{font-family:D;font-weight:900;src:url(../assets/InterDisplay-Bold.otf)}
*{box-sizing:border-box;margin:0}
html,body{background:#EEF1EC;overflow:hidden}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;font-family:D,sans-serif;color:#111318;background:linear-gradient(180deg,#F3F4F2 0%,#EEF2EC 45%,#D9EBD8 100%)}
.abs{position:absolute}
#card{position:absolute;left:540px;top:540px;border-radius:34px;background:#fff;box-shadow:0 30px 70px rgba(17,19,24,.16),0 2px 6px rgba(17,19,24,.06);overflow:hidden;transform-origin:50% 50%}
#tint{position:absolute;left:0;top:0;width:100%;height:100%}
.sw{position:absolute;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 2px 5px rgba(0,0,0,.2)}
.row{position:absolute;left:44px;display:flex;align-items:center;gap:18px;font:500 26px/1.1 D;color:#111318;white-space:nowrap}
.row svg{flex:none}
</style>
<div id="stage">
  <div id="frags" class="abs" style="left:0;top:0;width:1080px;height:1080px"></div>
  <div id="dotL" class="abs" style="left:516px;top:476px;width:48px;height:48px;border-radius:50%;background:#82E600"></div>
  <div id="wm" class="abs" style="left:290px;top:470px;width:500px;height:128px"><img src="../assets/logo_lime.png" style="width:500px;display:block"><div id="bars" class="abs" style="left:0;top:0;width:500px;height:128px"></div></div>
  <img id="pHero" class="abs" src="../assets/neo/hero_cut.png" style="width:300px;left:0;top:0">
  <img id="pIpx" class="abs" src="../assets/neo/ipx4_cut.png" style="width:330px;left:0;top:0">
  <div id="card"><div id="tint"></div>
    <div id="name" class="abs" style="left:44px;font:700 34px/1 D">SpaceBuds Neo+</div>
    <div id="maker" class="abs" style="left:44px;font:500 24px/1 D;color:#8A9088">oraimo</div>
    <svg id="chev" class="abs" width="26" height="16" viewBox="0 0 26 16"><path d="M3 3l10 10L23 3" fill="none" stroke="#111318" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div id="truth" class="abs" style="left:0;width:100%;text-align:center;font:700 40px/1 D;color:#fff"></div>
    <div id="sws" class="abs" style="left:0;top:0"></div>
    <div id="spec" class="abs" style="left:0;top:0;width:100%;height:100%"></div>
    <div id="buy" class="abs" style="height:58px;width:150px;border-radius:29px;background:linear-gradient(90deg,#B6FF4D,#82E600);font:700 28px/58px D;text-align:center;color:#0B1A00">Buy</div>
  </div>
  <div id="gl3" class="abs" style="left:0;top:0;width:1080px;height:1080px;pointer-events:none"></div>
  <div id="endDot" class="abs" style="left:516px;top:516px;width:48px;height:48px;border-radius:50%;background:#82E600;box-shadow:0 0 30px rgba(130,230,0,.6)"></div>
</div>
<script type="importmap">{ "imports": { "three": "../../../.claude/skills/motion-reel/engine/lib/three/three.module.js", "three/addons/": "../../../.claude/skills/motion-reel/engine/lib/three/addons/" } }</script>
<script src="../../moniepoint/assets/motion.js"></script>
<script>
const M = window.Motion, S = (t, p) => M.spring(t, p), clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, u) => a + (b - a) * u;
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const $ = id => document.getElementById(id);
window.FILM_DUR = 8.6;
const SNAP = { k: 300, c: 30 }, SOFT = { k: 90, c: 17 }, CARD = { k: 160, c: 23 }, POP = { k: 420, c: 38 };
// the five oraimo truths, one colour each (the reference's five colourways)
const STATES = [
  { t: 3.75, a: '#C9FF6E', b: '#7FD600', ink: '#0B1A00', truth: 'Hybrid ANC' },
  { t: 4.31, a: '#3A3D42', b: '#0D0E10', ink: '#FFFFFF', truth: '30 h playtime' },
  { t: 4.85, a: '#3DB813', b: '#12500A', ink: '#FFFFFF', truth: 'Sound360' },
  { t: 5.38, a: '#F1F2EF', b: '#A9AEA6', ink: '#111318', truth: 'IPX4' },
  { t: 5.92, a: '#DFF7C0', b: '#9ACB6A', ink: '#0B1A00', truth: 'Game mode' }];
const SPEC = [['ANC', 'Hybrid active noise cancelling'], ['360', 'Sound360 spatial audio'], ['30h', '30 h playtime (ANC off)'], ['MIC', 'Two-mic clear calls'], ['GAME', 'Low-latency game mode'], ['IPX4', 'IPX4 sweat and splash']];
const ICON = k => ({ ANC: '<circle cx="15" cy="15" r="11" fill="none" stroke="#111318" stroke-width="2.4"/><path d="M8 15h3l2-5 4 10 2-5h3" fill="none" stroke="#111318" stroke-width="2.2" stroke-linejoin="round"/>',
  '360': '<circle cx="15" cy="15" r="4" fill="#111318"/><ellipse cx="15" cy="15" rx="12" ry="6" fill="none" stroke="#111318" stroke-width="2.2"/>',
  '30h': '<rect x="4" y="8" width="20" height="14" rx="3" fill="none" stroke="#111318" stroke-width="2.4"/><rect x="25" y="12" width="3" height="6" rx="1" fill="#111318"/><rect x="7" y="11" width="11" height="8" rx="1.5" fill="#82E600"/>',
  MIC: '<rect x="11" y="4" width="8" height="14" rx="4" fill="none" stroke="#111318" stroke-width="2.4"/><path d="M7 14a8 8 0 0 0 16 0M15 22v4" fill="none" stroke="#111318" stroke-width="2.4" stroke-linecap="round"/>',
  GAME: '<rect x="3" y="9" width="24" height="13" rx="6.5" fill="none" stroke="#111318" stroke-width="2.4"/><circle cx="20" cy="15.5" r="2" fill="#111318"/><path d="M9 12v7M5.5 15.5h7" stroke="#111318" stroke-width="2.4"/>',
  IPX4: '<path d="M15 4c5 7 8 10.5 8 14a8 8 0 0 1-16 0c0-3.5 3-7 8-14z" fill="none" stroke="#111318" stroke-width="2.4"/>' })[k];
SPEC.forEach(([k, label], i) => { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = `<svg width="30" height="30" viewBox="0 0 30 30">${ICON(k)}</svg><span>${label}</span>`; $('spec').appendChild(r); });
STATES.forEach((s, i) => { const d = document.createElement('div'); d.className = 'sw'; d.style.background = `linear-gradient(135deg, ${s.a}, ${s.b})`; $('sws').appendChild(d); });
// fragments that become the lime dot (the reference's logo assembling)
const rnd = (() => { let a = 5; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
const FR = Array.from({ length: 14 }, (_, i) => { const d = document.createElement('div'); d.className = 'abs'; const w = 8 + rnd() * 14; d.style.width = w + 'px'; d.style.height = (w * (.5 + rnd() * .6)) + 'px'; d.style.borderRadius = '40%';
  d.style.background = ['#82E600', '#B6FF4D', '#2FA800'][i % 3]; $('frags').appendChild(d); return { d, a: rnd() * 6.28, r: 120 + rnd() * 160, sp: (rnd() < .5 ? -1 : 1) * (2 + rnd() * 3), w }; });
// six bars that wipe off the letters as the wordmark builds (the reference's typing bars)
const BARS = Array.from({ length: 6 }, (_, i) => { const d = document.createElement('div'); d.className = 'abs'; d.style.background = '#111318'; d.style.height = '18px'; d.style.top = (64 + (i % 2 ? -30 : 20)) + 'px'; $('bars').appendChild(d); return d; });
// the card's shape over time: small -> product card -> spec sheet -> product card -> dot
const cardShape = t => { const g1 = S(t - 2.5, CARD), wide = S(t - 6.43, CARD) - S(t - 7.5, CARD), sh = S(t - 7.95, { k: 220, c: 26 });
  let w = lerp(lerp(150, 430, g1), 860, wide), h = lerp(lerp(100, 520, g1), 560, wide); const s = 1 - sh * .95; return { w: w * s, h: h * s, r: lerp(34, 60, sh), wide, g1, sh }; };
// which state is showing, and how far into its swap
const stateAt = t => { let k = -1; STATES.forEach((s, i) => { if (t >= s.t) k = i; }); return k; };
window.CARD = { cardShape, stateAt, STATES };
window.seek = t => {
  const on = (a, b) => t >= a && t < b;
  // 1. fragments spiral in and settle into the dot
  { const g = sm((t - .05) / .75); FR.forEach(f => { const a = f.a + f.sp * (1 - g), r = f.r * (1 - g) * (1 - g), x = 540 + Math.cos(a) * r - f.w / 2, y = 500 + Math.sin(a) * r * .9 - f.w / 2;
      f.d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${((1 - g) * f.sp * 90).toFixed(1)}deg) scale(${(1 - .6 * sm((g - .7) / .3)).toFixed(3)})`; f.d.style.opacity = (g < .95 ? 1 : 0); });
    const dg = S(t - .62, POP), dx = S(t - 1.0, SOFT); $('dotL').style.display = on(.6, 1.65) ? '' : 'none';
    $('dotL').style.transform = `translate(${(dx * 157).toFixed(1)}px,${(dx * -2).toFixed(1)}px) scale(${(clamp(dg) * (1 - .55 * dx)).toFixed(3)})`; }
  // 2. the wordmark builds letter by letter; small bars wipe off the letters
  { const show = on(1.0, 1.75); $('wm').style.display = show ? '' : 'none';
    if (show) { const p = clamp((t - 1.0) / .5), out = sm((t - 1.55) / .15); $('wm').querySelector('img').style.clipPath = `inset(0 ${((1 - p) * 100).toFixed(1)}% 0 0)`; $('wm').style.opacity = 1 - out;
      $('wm').style.transform = `scale(${(1 - .1 * out).toFixed(3)})`;
      BARS.forEach((b, i) => { const c = clamp((t - 1.0 - i * .07) / .22), x = (i / 6) * 500 + c * 90; b.style.left = x.toFixed(1) + 'px'; b.style.width = ((1 - c) * 70).toFixed(1) + 'px'; b.style.opacity = c < 1 ? 1 : 0; }); } }
  // 3. two of oraimo's renders join the 3D case and buds in the cluster (the 3D layer draws the rest)
  [['pHero', 300, -150, 40, -16, 1.7], ['pIpx', 330, 170, 70, 14, 1.8]].forEach(([id, w, ox, oy, rot, t0]) => { const s = S(t - t0, SOFT), col = S(t - 2.4, { k: 200, c: 25 }), el = $(id);
    el.style.display = on(t0, 2.7) ? '' : 'none'; const x = 540 + ox * (1 - col) - w / 2 + (1 - s) * ox * 2.5, y = 540 + oy * (1 - col) - w / 2 + (1 - s) * 260;
    el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${(rot * (1 - col) + (1 - s) * rot * 2).toFixed(1)}deg) scale(${(clamp(s) * (1 - col * .9)).toFixed(3)})`;
    el.style.filter = `drop-shadow(0 24px 30px rgba(17,19,24,.25))${s < .98 ? ` blur(${((1 - s) * 10).toFixed(1)}px)` : ''}`; });
  // 4. the card: grows from the collapsing cluster, floods with colour, widens, folds, shrinks
  const c = cardShape(t), cardOn = on(2.45, 8.25); $('card').style.display = cardOn ? '' : 'none';
  if (cardOn) { const el = $('card'), pop = S(t - 2.45, POP);
    el.style.width = c.w.toFixed(1) + 'px'; el.style.height = c.h.toFixed(1) + 'px'; el.style.left = (540 - c.w / 2).toFixed(1) + 'px'; el.style.top = (540 - c.h / 2).toFixed(1) + 'px'; el.style.borderRadius = Math.min(c.r, c.w / 2, c.h / 2).toFixed(1) + 'px';
    el.style.transform = `scale(${(.6 + .4 * clamp(pop)).toFixed(3)}) rotate(${(lerp(-6, 0, clamp(pop)) + 0.4 * Math.sin(t * 1.3)).toFixed(2)}deg) translateY(${(4 * Math.sin(t * 1.6)).toFixed(1)}px)`;
    // colour flood: each state fills from the centre; it leaves for the spec sheet
    const k = stateAt(t), tint = $('tint'), clr = S(t - 6.43, CARD);
    if (k >= 0) { const st = STATES[k], f = sm((t - st.t) / .18); const prev = k > 0 ? STATES[k - 1] : null;
      tint.style.background = `radial-gradient(circle at 50% 46%, ${st.a} 0, ${st.b} ${(40 + 110 * f).toFixed(0)}%)${prev ? `, linear-gradient(160deg, ${prev.a}, ${prev.b})` : ''}`;
      tint.style.opacity = (k === 0 ? f : 1) * (1 - clamp(clr)); tint.style.clipPath = k === 0 ? `circle(${(f * 80).toFixed(1)}% at 50% 46%)` : '';
      const tr = $('truth'); tr.textContent = st.truth; tr.style.color = st.ink; const tw = S(t - st.t + .02, POP); tr.style.top = (c.h - 150).toFixed(1) + 'px';
      tr.style.opacity = (clamp(tw * 1.4) * (1 - clamp(clr * 2))).toFixed(3); tr.style.transform = `translateY(${((1 - tw) * 20).toFixed(1)}px)`; tr.style.filter = tw < .98 ? `blur(${((1 - tw) * 8).toFixed(1)}px)` : ''; }
    else { tint.style.opacity = 0; $('truth').style.opacity = 0; }
    // the name row of the product card (before the colours) and the swatches under the product (during them)
    const nm = S(t - 2.85, SNAP), nmOut = sm((t - 3.7) / .12);
    ['name', 'maker', 'chev'].forEach((id, i) => { const e = $(id); e.style.opacity = (clamp(nm * 1.4) * (1 - nmOut) * (1 - c.sh)).toFixed(3); });
    $('name').style.top = (c.h - 112).toFixed(1) + 'px'; $('maker').style.top = (c.h - 66).toFixed(1) + 'px'; $('chev').style.left = (c.w - 70).toFixed(1) + 'px'; $('chev').style.top = (c.h - 96).toFixed(1) + 'px';
    const swOn = clamp(S(t - 3.75, SNAP)) * (1 - clamp(clr * 2)); [...$('sws').children].forEach((d, i) => { d.style.left = (c.w / 2 - 98 + i * 40).toFixed(1) + 'px'; d.style.top = (c.h - 74).toFixed(1) + 'px';
      d.style.opacity = swOn.toFixed(3); d.style.transform = `scale(${(i === k ? 1.25 : 1) * clamp(swOn * 1.2)})`; d.style.boxShadow = i === k ? 'inset 0 0 0 2px #fff, 0 0 0 3px #111318' : ''; });
    // the spec sheet: rows type in on the left, the Buy pill lands
    const sp = c.wide; [...$('spec').children].forEach((r, i) => { const s = S(t - 6.55 - i * .07, SNAP), o = clamp(s * 1.4) * (1 - sm((t - 7.42) / .12)); r.style.top = (64 + i * 64).toFixed(1) + 'px'; r.style.opacity = (o * clamp(sp * 3)).toFixed(3);
      r.style.transform = `translateX(${((1 - s) * -24).toFixed(1)}px)`; r.style.filter = s < .98 ? `blur(${((1 - s) * 8).toFixed(1)}px)` : ''; });
    const bs = S(t - 6.95, POP), bo = clamp(bs * 1.5) * (1 - sm((t - 7.42) / .12)); $('buy').style.left = (c.w - 210).toFixed(1) + 'px'; $('buy').style.top = (c.h - 100).toFixed(1) + 'px'; $('buy').style.opacity = bo.toFixed(3); $('buy').style.transform = `scale(${(.6 + .4 * clamp(bs)).toFixed(3)})`; }
  // 5. the card becomes the lime dot
  { const d = S(t - 8.12, POP); $('endDot').style.display = on(8.1, 8.6) ? '' : 'none'; $('endDot').style.transform = `scale(${(clamp(d) * 1.0).toFixed(3)})`; }
};
Promise.all([...document.images].map(i => i.decode().catch(() => {})).concat([document.fonts.load("900 80px D"), document.fonts.load("700 80px D"), document.fonts.load("500 80px D")])).then(() => { window.__domOK = true; });
</script>
