<!doctype html>
<meta charset="utf-8">
<title>Neo+ 3D model test</title>
<!-- Test shot: the SpaceBuds Neo+ case and buds modelled in three.js, matched to oraimo's renders (assets/neo/*.jpg).
     seek(t): t 0 = hero 3/4 (like hero.jpg), 1 = tilted like closed.jpg, 2 = lid open with buds, 3 = buds close-up. -->
<style>html,body{margin:0;background:#050607;overflow:hidden}#stage{position:relative;width:1920px;height:1080px;overflow:hidden}</style>
<div id="stage"></div>
<script type="importmap">{ "imports": { "three": "../../../../../.claude/skills/motion-reel/engine/lib/three/three.module.js", "three/addons/": "../../../../../.claude/skills/motion-reel/engine/lib/three/addons/" } }</script>
<script type="module">
import { createStage } from '../../../../../.claude/skills/motion-reel/engine/lib/three-stage.js';
import { buildNeo } from '../neo-model.js';
const st = await createStage({ parent: document.getElementById('stage'), background: '#050607', fov: 26 });
const { THREE, scene, camera, renderer } = st;
scene.add(new THREE.HemisphereLight(0xffffff, 0x111111, 0.4)); scene.fog = new THREE.Fog(0x050607, 4, 7.5);
const rim = new THREE.PointLight(0x9CFF2E, 2.2, 5, 1.5); rim.position.set(-1.4, 1.2, -1.4); scene.add(rim);
const gc = document.createElement('canvas'); gc.width = gc.height = 512; const gg = gc.getContext('2d'); const rg = gg.createRadialGradient(256, 256, 0, 256, 256, 256); rg.addColorStop(0, 'rgba(130,230,0,.22)'); rg.addColorStop(.5, 'rgba(60,110,0,.07)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); gg.fillStyle = rg; gg.fillRect(0, 0, 512, 512);
const pool = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, depthWrite: false })); pool.rotation.x = -Math.PI / 2; pool.position.y = -0.455; scene.add(pool);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x07080a, roughness: 1, envMapIntensity: 0 })); fl.rotation.x = -Math.PI / 2; fl.position.y = -0.46; fl.receiveShadow = true; scene.add(fl);
const neo = await buildNeo(THREE, renderer, scene, '../../../assets/neo/');
const P = [
  { cam: [1.6, 0.9, 3.6], look: [0, 0.05, 0], rot: [0.08, -0.5, 0], lid: 0, buds: false },
  { cam: [0, 0.4, 3.8], look: [0, 0, 0], rot: [0.55, -0.35, 0.55], lid: 0, buds: false },
  { cam: [1.2, 1.5, 3.4], look: [0, 0.1, 0], rot: [0.0, -0.45, 0], lid: 1.85, buds: true },
  { cam: [0.2, 0.3, 1.9], look: [0, 0.35, 0], rot: [0, 0, 0], lid: 0, buds: 'solo' },
  { cam: [1.0, 1.35, 4.0], look: [0, 0.25, 0], rot: [0.0, -0.4, 0.0], lid: 1.75, buds: 'fly' },
  { cam: [0.6, 1.5, 3.0], look: [0, -0.05, 0], rot: [0.0, -0.3, 0.0], lid: 1.8, buds: true },
];
window.seek = t => { const p = P[Math.min(P.length - 1, Math.round(t))];
  camera.position.set(...p.cam); camera.lookAt(...p.look);
  neo.case.rotation.set(...p.rot); neo.setLid(p.lid); neo.case.visible = p.buds !== 'solo';
  neo.budL.visible = neo.budR.visible = !!p.buds;
  if (p.buds === 'solo') { scene.attach(neo.budL); scene.attach(neo.budR); neo.budL.position.set(-0.22, 0.35, 0); neo.budL.rotation.set(0.1, 0.35, 0.35); neo.budR.position.set(0.25, 0.3, 0.1); neo.budR.rotation.set(0.1, -0.35, -0.35); }
  else if (p.buds === 'fly') { neo.seatBuds(); scene.attach(neo.budL); scene.attach(neo.budR); neo.budL.position.set(-0.42, 0.95, 0.15); neo.budL.rotation.set(0.25, 0.7, 0.5); neo.budR.position.set(0.5, 0.85, 0.3); neo.budR.rotation.set(-0.15, -0.6, -0.55); }
  else { neo.seatBuds(); }
  neo.update(); st.render(); };
window.seek(0); window.__ready = true;
</script>
