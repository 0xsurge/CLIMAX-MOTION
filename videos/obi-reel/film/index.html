<!doctype html>
<meta charset="utf-8">
<title>Obi Igwe reel v2</title>
<!-- Obi Igwe portfolio reel v2, built with /climax-launch (see ../STORYBOARD.md).
     Carrier law: one focus frame survives every scene (highlight -> frame -> flood -> slit -> image pill -> screen ->
     slot -> dot -> ring -> full stop -> link pill). Every transformation takes 3-10 frames and gets a 4-frame
     punch-zoom; the camera otherwise holds with a slow drift. 1920x1080, 129.2 BPM grid, pure function of t. -->

  #portrait img { width: 100%; height: 100%; display: block; object-fit: cover; }

<div id="stage">

</div>
<script src="../assets/motion.js"></script>

const dots = Array.from({ length: 22 }, () => mk(`<div class="abs" style="width:256px;height:144px;margin:-72px 0 0 -128px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px rgba(61,123,255,.9),0 14px 30px rgba(0,0,0,.5)"><canvas width="256" height="144" style="display:block"></canvas></div>`));

  box(blueL, camX + 900 + 160 * Math.sin(t * .37), camY - 380 + 100 * Math.cos(t * .3), 1500, 1500); blueL.style.background = `radial-gradient(closest-side, rgba(61,123,255,${.06 + .3 * clear}), rgba(61,123,255,0))`;
  let gx = 0; for (let i = 1; i < 6; i++) gx += 240 * camMove(t, B(18 + 2 * i), .045); for (let i = 1; i < 4; i++) gx += 240 * camMove(t, B(30 + 2 * i), .045);
