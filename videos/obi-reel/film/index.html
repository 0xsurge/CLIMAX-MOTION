<!doctype html>
<meta charset="utf-8">
<title>Obi Igwe reel v2</title>
<!-- Obi Igwe portfolio reel v2, built with /climax-launch (see ../STORYBOARD.md).
     Carrier law: one focus frame survives every scene (highlight -> frame -> flood -> slit -> image pill -> screen ->
     slot -> dot -> ring -> full stop -> link pill). Every transformation takes 3-10 frames and gets a 4-frame
     punch-zoom; the camera otherwise holds with a slow drift. 1920x1080, 129.2 BPM grid, pure function of t. -->
<style>

  .blue { color: #3D7BFF; } .lamp { color: #FFB04A; }

  .shard { position: absolute; border-radius: 14px; border: 2px solid rgba(255,176,74,.55); background: rgba(255,176,74,.07); }
  .pillimg { display: inline-block; height: 112px; border-radius: 20px; overflow: hidden; vertical-align: middle; margin: 0 .14em; box-shadow: 0 0 0 3px #3D7BFF; }

  #portrait img { width: 100%; height: 100%; display: block; object-fit: cover; }

<div id="stage">

  <div id="cam"></div>
</div>
<script src="../assets/motion.js"></script>

const IM = {}; FILMS.forEach(([id]) => { IM[id] = []; for (let k = 1; k <= 69; k++) { const im = new Image(); im.src = `../assets/clips/${id}/${String(k).padStart(3, '0')}.jpg`; IM[id].push(im); } });

  box(blueL, 900 + 160 * Math.sin(t * .37), -380 + 100 * Math.cos(t * .3), 1500, 1500); blueL.style.background = `radial-gradient(closest-side, rgba(61,123,255,${.06 + .3 * clear}), rgba(61,123,255,0))`;

  else if (t >= B(7) && t < B(10)) { const [x, y, w, h] = pos(ed), u = S(t - B(7), MORPH); C = rectLerp([x - 10, y - 8, w + 20, h + 16], [410, 230, 1100, 620], u); style = u > .4 ? 'frame' : 'amber'; }

    if (style === 'frame') { car.style.background = 'transparent'; car.style.border = '4px solid #3D7BFF'; car.style.borderRadius = '26px'; }
    if (style === 'flood') { car.style.background = '#3D7BFF'; car.style.border = '0'; car.style.borderRadius = t < B(14) ? '26px' : '3px'; } }
