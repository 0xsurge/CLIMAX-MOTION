<!doctype html><meta charset="utf-8">
<!-- Storyboard v5 for the first 20 s (16:9). Story built like the Bolt, Higgsfield and EarnEdits references: a relatable
     question, real everyday moments in photo frames with big words over them, the brand carrying them, a character,
     the logo pill, the real app, then "No stress" slams beside the phone. One frame per ?b=N. -->
<style>
@font-face{font-family:S;font-weight:500;src:url(../assets/satoshi-500.woff2)}
@font-face{font-family:S;font-weight:700;src:url(../assets/satoshi-700.woff2)}
@font-face{font-family:S;font-weight:900;src:url(../assets/satoshi-900.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:S,Inter,sans-serif;background:#F7F8FB;color:#0B1B3F;position:relative}
.f{position:absolute;inset:0;display:none}.abs{position:absolute}
.bl{color:#0460EF}.big{font-weight:900;letter-spacing:-.045em;line-height:.95}
.photo{position:absolute;border-radius:48px;overflow:hidden;box-shadow:0 40px 100px rgba(2,27,74,.22)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;display:flex;align-items:center;gap:18px;background:#fff;border-radius:999px;padding:16px 30px 16px 16px;font:700 34px/1 S;box-shadow:0 20px 50px rgba(2,27,74,.18);white-space:nowrap}
.chip img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.blob{position:absolute;border-radius:50%}
</style>
<body>
<svg width="0" height="0" style="position:absolute"><defs><path id="dart" d="M0 120 L42 98 Q50 94 58 98 L100 120 L60 16 Q50 -2 40 16 Z"/></defs></svg>

<!-- 1  0-1.4 s: the question, one line, white ground, blue type -->
<div class="f" id="b1">
  <div class="blob" style="left:-500px;top:500px;width:1100px;height:1100px;background:radial-gradient(closest-side,rgba(4,96,239,.4),rgba(4,96,239,0))"></div>
  <div class="blob" style="left:1480px;top:-420px;width:1000px;height:1000px;background:radial-gradient(closest-side,rgba(79,209,255,.42),rgba(79,209,255,0))"></div>
  <div class="abs big bl" style="left:0;width:1920px;text-align:center;top:450px;font-size:170px">Sent it?</div>
</div>

<!-- 2  1.4-4 s: real moments in rounded frames, the big word lies across them (Bolt "somewhere") -->
<div class="f" id="b2">
  <div class="photo" style="left:180px;top:150px;width:1000px;height:640px"><img src="../assets/life/l4.jpg"></div>
  <div class="photo" style="left:1260px;top:360px;width:520px;height:560px"><img src="../assets/life/l6.jpg"></div>
  <div class="abs" style="left:180px;top:60px;font:700 64px/1 S">Your money is</div>
  <div class="abs big" style="left:420px;top:560px;font-size:250px;color:#fff;text-shadow:0 10px 60px rgba(2,27,74,.45)">somewhere.</div>
</div>

<!-- 3  4-6.5 s: the dart carries the moments over a blue hill; each one pops up above it (Bolt van) -->
<div class="f" id="b3">
  <div class="abs" style="left:-200px;top:690px;width:2320px;height:900px;border-radius:50%;background:linear-gradient(180deg,#2F7BFF 0%,#0460EF 40%,#0342B8 100%)"></div>
  <svg class="abs" style="left:880px;top:610px;transform:rotate(90deg)" width="160" height="192" viewBox="0 0 100 120"><use href="#dart" fill="#fff"/></svg>
  <div class="photo" style="left:360px;top:120px;width:560px;height:400px;transform:rotate(-6deg);border:8px solid #fff"><img src="../assets/life/l1.jpg"></div>
  <div class="photo" style="left:1000px;top:80px;width:580px;height:410px;transform:rotate(5deg);border:8px solid #fff"><img src="../assets/life/l7.jpg"></div>
  <div class="chip" style="left:430px;top:480px">Shop stock · ₦45,000</div>
  <div class="chip" style="left:1120px;top:450px">Mama's upkeep · ₦10,000</div>
  <div class="abs" style="left:0;width:1920px;text-align:center;top:840px;font:700 60px/1 S;color:#fff">Rent. School fees. Mama's upkeep.</div>
</div>

<!-- 4  6.5-8.5 s: the character; the line sits beside her (Bolt "Shouldn't be a struggle") -->
<div class="f" id="b4">
  <div class="blob" style="left:1000px;top:60px;width:1100px;height:1100px;background:radial-gradient(closest-side,rgba(4,96,239,.28),rgba(4,96,239,0))"></div>
  <div class="photo" style="left:1060px;top:90px;width:720px;height:900px"><img src="../assets/life/l3.jpg" style="object-position:40% 50%"></div>
  <div class="abs big" style="left:140px;top:330px;font-size:150px">Waiting<br>shouldn't be<br><span class="bl">a struggle.</span></div>
</div>

<!-- 5  8.5-10 s: the logo pill (Bolt), the dart lands as the mark -->
<div class="f" id="b5">
  <div class="abs" style="left:770px;top:400px;width:380px;height:280px;border-radius:70px;background:#0460EF;display:flex;align-items:center;justify-content:center;box-shadow:0 40px 100px rgba(4,96,239,.35)"><img src="../assets/icon.png" style="width:190px;border-radius:44px"></div>
  <div class="abs" style="left:0;width:1920px;text-align:center;top:760px;font:900 84px/1 S;letter-spacing:-.03em">Moniepoint</div>
</div>

<!-- 6  10-13.5 s: the real app: pick who, the amount, tap (Bolt ride card + search bar) -->
<div class="f" id="b6">
  <div class="abs" style="left:0;width:1920px;text-align:center;top:130px;font:900 120px/1 S;letter-spacing:-.04em">Pick who. <span class="bl">Tap send.</span></div>
  <div class="abs" style="left:430px;top:360px;width:1060px;height:190px;background:#fff;border-radius:40px;box-shadow:0 20px 60px rgba(2,27,74,.10);display:flex;align-items:center;padding:0 40px;font:900 130px/1 Inter,S;color:#0460EF;letter-spacing:-.04em">₦10,000</div>
  <div class="abs" style="left:430px;top:620px;width:1060px;height:220px;background:#fff;border-radius:40px;border:5px solid #0460EF;box-shadow:0 0 0 10px rgba(79,209,255,.25),0 30px 80px rgba(2,27,74,.14);display:flex;align-items:center;gap:30px;padding:0 36px">
    <img src="../assets/p_receiver.png" style="width:120px;height:120px;border-radius:30%;object-fit:cover"><div><div style="font:700 48px/1.1 S">Ada Okafor</div><div style="font:500 32px/1.3 S;color:#6B7A99">Moniepoint · 81 0000 0000</div></div>
    <div style="margin-left:auto;font:700 30px/1 S;background:#A4F4AD;color:#0B7A2A;padding:14px 22px;border-radius:999px">Instant</div></div>
</div>

<!-- 7  13.5-16.5 s: slam beside the phone (Bolt "No Stress") -->
<div class="f" id="b7">
  <div class="abs big" style="left:140px;top:360px;font-size:220px">No<br><span class="bl">stress.</span></div>
  <div class="photo" style="left:1060px;top:60px;width:560px;height:1060px;border-radius:80px;background:#0A0D14;padding:18px;transform:rotate(8deg)"><img src="../assets/receipt.png" style="border-radius:64px;object-fit:cover;object-position:top"></div>
</div>

<!-- 8  16.5-19 s: the second slam (Bolt "No begging") -->
<div class="f" id="b8">
  <div class="abs big" style="left:120px;top:330px;font-size:140px">No more<br><span class="bl">“have you<br>seen it?”</span></div>
  <div class="photo" style="left:1200px;top:110px;width:600px;height:860px"><img src="../assets/life/l2.jpg" style="object-position:50% 40%"></div>
  <div class="chip" style="left:1080px;top:760px"><img src="../assets/icon.png" style="border-radius:16px">Credit alert: ₦10,000.00</div>
</div>
<script>document.getElementById('b'+(new URLSearchParams(location.search).get('b')||1)).style.display='block'</script>
