<!doctype html><meta charset="utf-8"><title>DRIP VERSE stills</title>
<style>
@font-face{font-family:Bodoni;src:url(assets/fonts/bodoni-normal.woff2);font-weight:400 600;font-style:normal}
@font-face{font-family:Bodoni;src:url(assets/fonts/bodoni-italic.woff2);font-weight:400 600;font-style:italic}
@font-face{font-family:Geist;src:url(assets/fonts/geist.woff2);font-weight:100 900}
:root{--ink:#0B0B0C;--stone:#E6E2DA;--bone:#F3EFE8;--brass:#B8935A}
html,body{margin:0;background:var(--ink)}
#f{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
#f *{position:absolute;box-sizing:border-box}
#f span{position:static}
.card{border-radius:30px;overflow:hidden;background-size:cover;background-position:center;filter:saturate(.82) contrast(1.03) sepia(.07)}
</style>
<div id="f"></div>
<script>
const $=document.getElementById('f'), S=new URLSearchParams(location.search).get('s')||'hook';
const P=n=>`assets/photos/${n}`;
const h=(s)=>{$.insertAdjacentHTML('beforeend',s)};
const rings=(cx,cy,rx0,n,gap,ratio,col,a0)=>{let s='';for(let i=0;i<n;i++){const rx=rx0+i*gap,ry=rx*ratio;s+=`<div style="left:${cx-rx}px;top:${cy-ry}px;width:${rx*2}px;height:${ry*2}px;border-radius:50%;border:${2.2-i*.18}px solid ${col};opacity:${a0*(1-i/n)};"></div>`}return s};
const shadow=(cx,cy,w,h2,a)=>`<div style="left:${cx-w/2}px;top:${cy-h2/2}px;width:${w}px;height:${h2}px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,${a}),rgba(0,0,0,0));filter:blur(10px)"></div>`;

if(S==='hook'){           // t = 3.0 s : black, "Drip" with a drop hanging off the p, a surface waiting below
  $.style.background='radial-gradient(900px 700px at 50% 1500px,#17181a,#0B0B0C 70%)';
  h(`<div id="w" style="left:90px;top:520px;font:400 330px/1 Bodoni;color:var(--bone);letter-spacing:-8px;white-space:nowrap"><span>D</span><span>r</span><span>i</span><span id="p">p</span></div>`);
  const p=document.getElementById('p').getBoundingClientRect();
  const px=p.left+p.width*.27, top=p.top+p.height*.88;
  h(`<svg width="1080" height="1920" style="left:0;top:0"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#cfc9bd"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#bdb6a8"/></linearGradient></defs>
   <path d="M${px-9} ${top} C ${px-9} ${top+120}, ${px-3} ${top+170}, ${px-2} ${top+250} C ${px-40} ${top+300}, ${px-40} ${top+390}, ${px} ${top+400} C ${px+40} ${top+390}, ${px+40} ${top+300}, ${px+2} ${top+250} C ${px+3} ${top+170}, ${px+9} ${top+120}, ${px+9} ${top} Z" fill="url(#g)"/>
   <path d="M${px} ${top+560} c -16 28 -26 44 -26 62 a26 26 0 0 0 52 0 c 0 -18 -10 -34 -26 -62z" fill="url(#g)" opacity=".92"/></svg>`);
  h(`<div style="left:90px;top:1080px;font:italic 400 160px/1 Bodoni;color:var(--brass);letter-spacing:-3px">Time</div>`);
  h(`<div style="left:0;top:1480px;width:1080px;height:440px;background:linear-gradient(#0B0B0C,#101113 40%,#0B0B0C)"></div>`);
  h(rings(px,1560,70,7,70,.2,'rgba(243,239,232,.7)',.9));
  h(`<div style="left:${px-60}px;top:1546px;width:120px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0))"></div>`);
  h(`<div style="left:90px;top:1740px;font:500 26px/1 Geist;letter-spacing:.34em;color:rgba(243,239,232,.6)">DRIP VERSE</div>`);
}
if(S==='hero'){           // t = 9.0 s : stone world, the shoe is the only thing in frame, rings on the floor
  $.style.background='linear-gradient(#EAE6DF,#DAD5CC)';
  h(rings(540,1100,230,8,64,.22,'rgba(11,11,12,.55)',.55));
  h(shadow(560,1105,820,90,.42));
  h(`<img src="${P('axel-arigato_cut.png')}" style="left:-70px;top:240px;width:1220px;transform:rotate(-5deg)">`);
  h(`<div style="left:90px;top:170px;font:400 150px/.92 Bodoni;color:var(--ink);letter-spacing:-4px">New<br><i style="color:var(--brass)">arrivals</i></div>`);
  h(`<div style="left:90px;top:1470px;width:560px;font:400 34px/1.35 Geist;color:rgba(11,11,12,.7)">Luxury footwear, ordered in a tap and brought to your door.</div>`);
  h(`<div style="left:90px;top:1640px;height:84px;padding:0 44px;border-radius:42px;background:var(--ink);color:var(--bone);font:600 28px/84px Geist;letter-spacing:.02em">Shop the drop</div>`);
}
if(S==='montage'){        // t = 16.0 s : after the drop, three columns of cards drift at different speeds
  $.style.background='#0B0B0C';
  const cols=[['nb-550.jpg','jordan-4.jpg','nike-af1.jpg'],['balenciaga-runner.jpg','asics-kayano.jpg','nb-480.jpg'],['nike-zoom.jpg','adidas-niteball.jpg','axel-arigato.jpg']];
  const ar=[[1.25,1,2.15],[1.25,2.1,1.25],[1.25,1.44,1.44]];
  const off=[-120,-420,-40];
  cols.forEach((c,ci)=>{let y=off[ci];c.forEach((n,ri)=>{const w=316,hh=Math.round(w*ar[ci][ri]);h(`<div class="card" style="left:${44+ci*340}px;top:${y}px;width:${w}px;height:${hh}px;background-image:url(${P(n)})"></div>`);y+=hh+24})});
  // water lens: a refracted circle over the middle of the grid
  h(`<svg width="0" height="0"><filter id="wl" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="12" xChannelSelector="R" yChannelSelector="G"/></filter></svg>`);
  h(`<div style="left:140px;top:610px;width:800px;height:800px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(243,239,232,.55), 0 40px 120px rgba(0,0,0,.6)"><div id="lens" style="left:-140px;top:-610px;width:1080px;height:1920px;filter:url(#wl)"></div></div>`);
  const lens=document.getElementById('lens');
  cols.forEach((c,ci)=>{let y=off[ci];c.forEach((n,ri)=>{const w=316,hh=Math.round(w*ar[ci][ri]);lens.insertAdjacentHTML('beforeend',`<div class="card" style="left:${44+ci*340-8}px;top:${y}px;width:${w+16}px;height:${hh}px;background-image:url(${P(n)})"></div>`);y+=hh+24})});
  h(rings(540,1010,430,3,52,1,'rgba(243,239,232,.3)',.8));
  h(`<div style="left:90px;top:1500px;font:400 170px/.9 Bodoni;color:var(--bone);letter-spacing:-6px;mix-blend-mode:difference">Drip<br><i>Time</i></div>`);
}
if(S==='delivery'){       // t = 24.0 s : the order, stand-in UI, a drop lands on the card surface
  $.style.background='radial-gradient(1000px 900px at 540px 700px,#1b1c1e,#0B0B0C 70%)';
  h(`<div style="left:90px;top:210px;font:400 120px/.95 Bodoni;color:var(--bone);letter-spacing:-3px">Ordered.<br><i style="color:var(--brass)">On its way.</i></div>`);
  h(shadow(540,860,640,60,.7));
  h(`<img src="${P('adidas-niteball_cut.png')}" style="left:-60px;top:-90px;width:1200px">`);
  h(rings(540,1130,180,6,64,.24,'rgba(243,239,232,.5)',.8));
  h(`<div style="left:70px;top:1060px;width:940px;height:690px;border-radius:44px;background:linear-gradient(rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 50px 120px rgba(0,0,0,.6)"></div>`);
  h(rings(540,1275,150,6,70,.26,'rgba(243,239,232,.45)',.75));
  h(`<div style="left:120px;top:1130px;font:600 34px/1 Geist;color:var(--bone)">Order confirmed</div><div style="left:120px;top:1184px;font:400 26px/1 Geist;color:rgba(243,239,232,.55)">Estimated: today</div>`);
  const nodes=[['Confirmed',150],['On its way',540],['At your door',930]];
  h(`<div style="left:150px;top:1588px;width:780px;height:3px;background:rgba(243,239,232,.2)"></div><div style="left:150px;top:1588px;width:420px;height:3px;background:var(--brass)"></div>`);
  nodes.forEach(([t,x],i)=>{h(`<div style="left:${x-17}px;top:1572px;width:34px;height:34px;border-radius:50%;background:${i<2?'var(--brass)':'#0B0B0C'};box-shadow:inset 0 0 0 3px ${i<2?'var(--brass)':'rgba(243,239,232,.3)'}"></div><div style="left:${x-130}px;top:1636px;width:260px;text-align:center;font:500 25px/1 Geist;color:${i<2?'var(--bone)':'rgba(243,239,232,.45)'}">${t}</div>`)});
  h(`<div style="left:${150+420-9}px;top:1579px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(184,147,90,.35)"></div>`);
}
document.fonts.ready.then(()=>{window.__ready=true});
</script>
