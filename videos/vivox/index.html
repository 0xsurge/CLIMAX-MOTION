<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vivox: Meet Rachel</title>
<style>
  html, body { margin: 0; background: #FFFFFF; overflow: hidden; }
  #stage { position: relative; overflow: hidden; transform-origin: 0 0; background: #FFFFFF; }
</style>
<script src="tokens.js"></script>
<script src="engine/lib/motion.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
  window.__ready = false;
  (() => {
    const q = new URLSearchParams(location.search), el = document.getElementById('stage');
    el.style.width = (q.get('w') || 1920) + 'px'; el.style.height = (q.get('h') || 1080) + 'px';
    window.FORMAT = { w: +(q.get('w') || 1920), h: +(q.get('h') || 1080) };
  })();
</script>
<script src="film.js"></script>
<script>
  Promise.all(window.__preload || []).then(() => document.fonts.ready).then(() => window.seek(0)).then(() => { window.__ready = true; });
</script>
</body>
</html>
