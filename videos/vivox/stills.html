<!doctype html><meta charset="utf-8"><title>Vivox stills</title>
<style>
@font-face{font-family:Inter;src:url(assets/fonts/inter.woff2);font-weight:300 800}
:root{--blue:#0051FF;--navy:#04152A;--g600:#535862}
html,body{margin:0;background:#777}
#f{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:Inter}
#f *{position:absolute;box-sizing:border-box}
#f span,#f b,#f i{position:static}
</style>
<div id="f"></div>
<script>
const $=document.getElementById('f'), S=new URLSearchParams(location.search).get('s')||'open';
const h=s=>$.insertAdjacentHTML('beforeend',s);
const orb=(cx,cy,r,glow=1)=>`<div style="left:${cx-r}px;top:${cy-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#BFD3FF 0%,#4D86FF 28%,#0051FF 62%,#0035B8 100%);box-shadow:0 0 ${60*glow}px ${12*glow}px rgba(0,81,255,.35),0 0 ${160*glow}px rgba(0,81,255,.25)"></div>`;
const handles=(x,y,w,hh,col='#0051FF')=>`<div style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;border:2px solid ${col}"></div>`+[[x,y],[x+w,y],[x,y+hh],[x+w,y+hh]].map(([a,b])=>`<div style="left:${a-7}px;top:${b-7}px;width:14px;height:14px;background:#fff;border:2px solid ${col}"></div>`).join('');
const chip=(x,y,txt,fs=88,pad=34)=>`<div style="left:${x}px;top:${y}px;height:${fs*1.32}px;padding:0 ${pad}px;border-radius:${fs}px;background:var(--blue);color:#fff;font:600 ${fs}px/${fs*1.32}px Inter;letter-spacing:-.02em;white-space:nowrap;box-shadow:0 18px 40px rgba(0,81,255,.28)">${txt}</div>`;
const word=(x,y,t,fs=110,col='var(--navy)')=>`<div style="left:${x}px;top:${y}px;font:600 ${fs}px/1 Inter;color:${col};letter-spacing:-.035em;white-space:nowrap">${t}</div>`;
// a crop of the real dashboard as a floating card (crop window x,y,w,h in the 1898x861 source, shown at scale k)
const crop=(x,y,cx,cy,cw,ch,k=1,rot=0)=>`<div style="left:${x}px;top:${y}px;width:${cw*k}px;height:${ch*k}px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(4,21,42,.16),0 0 0 1px rgba(4,21,42,.06);transform:rotate(${rot}deg)"><img src="assets/product_ui.webp" style="left:${-cx*k}px;top:${-cy*k}px;width:${1898*k}px"></div>`;

if(S==='open'){   // t = 2.5 s : the problem, a sentence in space with real report cards between the words
  h(word(150,170,'Every'));
  h(crop(520,120,560,180,520,170,.95,-3));
  h(word(1060,170,'alert.'));
  h(word(260,420,'Every'));
  h(crop(640,380,560,420,520,190,.9,2));
  h(word(1150,420,'entity.'));
  h(word(150,690,'Every'));
  h(chip(530,664,'check.',104,40));
  h(crop(1260,600,1300,330,520,330,.95,-2));
  h(orb(1010,742,20,.6));
}
if(S==='rachel'){ // t = 9.0 s : the drop. "Meet Rachel*", portrait in the infinity, frame snaps on, lit skill list
  h(word(150,150,'Meet',120));
  h(chip(500,128,'Rachel*',112,40));
  h(`<div style="left:150px;top:300px;font:500 54px/1.2 Inter;color:var(--g600);letter-spacing:-.02em">Your AI compliance analyst.</div>`);
  h(`<img src="assets/rachel_blue.webp" style="left:1060px;top:230px;width:800px">`);
  h(handles(1440,210,400,540));
  h(`<div style="left:1442px;top:170px;height:30px;padding:0 10px;background:var(--blue);color:#fff;font:600 18px/30px Inter">Rachel · AI analyst</div>`);
  const L=['Adverse media monitoring','Sanctions and PEP alert reviews','Corporate registry analysis','UBO documents analysis'];
  L.forEach((t,i)=>h(`<div style="left:${i===1?196:150}px;top:${560+i*86}px;font:${i===1?600:500} 46px/1 Inter;color:${i===1?'#0051FF':'rgba(4,21,42,.22)'};letter-spacing:-.02em;white-space:nowrap">${t}</div>`));
  h(`<svg width="34" height="30" viewBox="0 0 34 30" style="left:150px;top:648px"><path d="M2 15 H30 M18 3 L31 15 L18 27" fill="none" stroke="#0051FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  h(orb(940,666,20,.6));
}
if(S==='product'){ // t = 16.0 s : the frame has grown into the real dashboard; the camera glides, frames snap on sections
  $.style.background='#F6F7F9';
  h(`<div style="left:110px;top:120px;width:1700px;height:771px;border-radius:26px;overflow:hidden;box-shadow:0 50px 120px rgba(4,21,42,.16),0 0 0 1px rgba(4,21,42,.06)"><img src="assets/product_ui.webp" style="left:-20px;top:-60px;width:2100px"></div>`);
  h(handles(490,300,920,170));
  h(`<div style="left:492px;top:260px;height:30px;padding:0 10px;background:var(--blue);color:#fff;font:600 18px/30px Inter">Business activity risk</div>`);
  h(orb(1422,470,18,.6));
  h(`<div style="left:1330px;top:930px;font:600 64px/1 Inter;color:var(--navy);letter-spacing:-.03em">Explainable.</div>`);
  h(chip(150,906,'Audited.',64,28));
}
if(S==='end'){    // t = 30.5 s : the orb has split into two and looped into the infinity mark; logo and Book a Demo
  h(`<img src="assets/logo.svg" style="left:560px;top:420px;width:800px;height:113px">`);
  h(`<div style="left:760px;top:600px;height:96px;padding:0 44px;border-radius:14px;background:var(--blue);color:#fff;font:600 34px/96px Inter;box-shadow:0 18px 40px rgba(0,81,255,.28)">Book a Demo &nbsp;→</div>`);
  h(`<div style="left:600px;top:760px;width:720px;text-align:center;font:500 30px/1.3 Inter;color:var(--g600)">Superpower for compliance teams.</div>`);
}
document.fonts.ready.then(()=>{window.__ready=true});
</script>
