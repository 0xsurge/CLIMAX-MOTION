<!doctype html>
<meta charset="utf-8">
<title>Sterling grounds</title>
<!-- Mood ground for the Sterling film. Smooth chrome forms in a black void: the Sterling check stroke bent
     into a thick tube, plus two folded ribbons. They are lit by a coloured gradient light that travels across
     them (the studio rotates), so the surfaces change colour as it passes: red-orange -> amber -> magenta for
     the "claim" chapter, teal -> emerald -> lime for "verified". seek(t) paints time t (seconds); window.CH
     picks the chapter palette. Edges defocused like a shallow lens. -->
<style>html,body{margin:0;background:#030404;overflow:hidden}#out{display:block;width:1920px;height:1080px}</style>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="importmap">{"imports":{"three":"../assets/three/three.module.js","three/addons/":"../assets/three/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H, false); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#030404');
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 200);

// ---- the studio: a dome whose colour bands rotate (the moving light) ----
const PAL = {
  claim: ['#1a0300', '#ff3d12', '#ff8a1f', '#ffd36b', '#ff2d6f', '#5fd6ff'],
  verified: ['#00140d', '#0fbf7a', '#3dffb0', '#d8ff7a', '#0aa3a3', '#9fe8ff'],
};
const domeMat = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { ph: { value: 0 }, c: { value: PAL.claim.map(x => new THREE.Color(x)) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `varying vec3 vP; uniform float ph; uniform vec3 c[6];
    vec3 ramp(float x){ x = fract(x); float s = x*5.; int i = int(floor(s)); float f = smoothstep(0.,1.,fract(s));
      vec3 a = c[1], b = c[2]; if(i==1){a=c[2];b=c[3];} else if(i==2){a=c[3];b=c[4];} else if(i==3){a=c[4];b=c[1];} else if(i==4){a=c[1];b=c[2];} return mix(a,b,f); }
    void main(){ float az = atan(vP.z, vP.x)/6.2831853 + ph; float el = vP.y;
      // three soft light bands sweeping round the studio, a cool rim strip high up, black elsewhere
      float band = pow(max(0., sin(az*6.2831853*2.)), 2.2) * smoothstep(-.6, .3, el) * (1. - smoothstep(.55, .95, el));
      float rim = smoothstep(.86, .96, el) * .9;
      vec3 col = c[0] * .4 + ramp(az*1.3 + el*.25) * band * 5. + c[5] * rim * 2.5;
      gl_FragColor = vec4(col, 1.); }` });
const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 64, 32), domeMat));
const pm = new THREE.PMREMGenerator(r);

// ---- the forms ----
const chrome = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: .1, clearcoat: 1, clearcoatRoughness: .04 });
const s = 1 / 48.6, cx = 108.15, cy = 214.34, P = (x, y, z = 0) => new THREE.Vector3((x - cx) * s, -(y - cy) * s, z);
// the check stroke as a smooth bent tube (rounded corner at the bottom of the tick)
const tickCurve = new THREE.CatmullRomCurve3([P(84, 214, .3), P(92, 222, .1), P(99.5, 230, 0), P(104, 226, -.1), P(118, 210, -.2), P(132, 196, -.4)], false, 'catmullrom', .5);
const tickGeo = new THREE.TubeGeometry(tickCurve, 260, .34, 64, false);
const ribbon = (pts, w, d) => { const sh = new THREE.Shape(); const rr = d * .5; sh.moveTo(-w / 2 + rr, -d / 2); sh.lineTo(w / 2 - rr, -d / 2); sh.quadraticCurveTo(w / 2, -d / 2, w / 2, 0); sh.quadraticCurveTo(w / 2, d / 2, w / 2 - rr, d / 2); sh.lineTo(-w / 2 + rr, d / 2); sh.quadraticCurveTo(-w / 2, d / 2, -w / 2, 0); sh.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + rr, -d / 2);
  return new THREE.ExtrudeGeometry(sh, { steps: 260, bevelEnabled: false, extrudePath: new THREE.CatmullRomCurve3(pts, false, 'catmullrom', .5) }); };
const ribA = ribbon([new THREE.Vector3(-9, -7, -6), new THREE.Vector3(-4, -2, -3), new THREE.Vector3(-1, 1.5, -5), new THREE.Vector3(3, 2, -8), new THREE.Vector3(8, 7, -12)], 5.2, .7);
const ribB = ribbon([new THREE.Vector3(14, -9, -4), new THREE.Vector3(9, -3, -2), new THREE.Vector3(7.5, 1, -1), new THREE.Vector3(9, 5, -3), new THREE.Vector3(13, 8, -6)], 6.5, .9);
const tick = new THREE.Mesh(tickGeo, chrome), rA = new THREE.Mesh(ribA, chrome), rB = new THREE.Mesh(ribB, chrome);
scene.add(tick, rA, rB);

const out = document.getElementById('out').getContext('2d');
const blurC = document.createElement('canvas'); blurC.width = W; blurC.height = H; const bctx = blurC.getContext('2d');
// layouts: where the forms sit so the type area (centre band) stays dark
const LAY = {
  right: { tick: [7.2, -.4, 2, 9.5, .3, -.6, .15], rA: [-2, 0, -8, 1, .2, .4, 0], rB: [1, 0, 0, 1, 0, 0, 0] },
  left: { tick: [-7.4, .6, 2, 9.5, -.2, .7, -.1], rA: [6, 1, -8, 1, -.2, -.5, .3], rB: [-21, 0, 0, 1, 0, Math.PI, 0] },
  close: { tick: [1.5, -1.8, 9, 7, .5, -.3, .1], rA: [-3, 2, -6, 1, .1, .3, 0], rB: [2, 0, 0, 1, 0, 0, 0] },
};
const place = (m, a) => { m.position.set(a[0], a[1], a[2]); m.scale.setScalar(a[3]); m.rotation.set(a[4], a[5], a[6]); };
window.CH = 'claim'; window.LAYOUT = 'right';
window.seek = t => {
  domeMat.uniforms.c.value = PAL[window.CH].map(x => new THREE.Color(x)); domeMat.uniforms.ph.value = t * .07;
  const env = pm.fromScene(envScene, .015); scene.environment = env.texture;
  const L = LAY[window.LAYOUT]; place(tick, L.tick); place(rA, L.rA); place(rB, L.rB);
  tick.rotation.y += Math.sin(t * .35) * .12; rA.rotation.z += t * .01;
  cam.position.set(Math.sin(t * .2) * .6, Math.cos(t * .17) * .3, 19); cam.lookAt(0, 0, 0);
  r.render(scene, cam); env.dispose();
  out.drawImage(r.domElement, 0, 0);
  bctx.globalCompositeOperation = 'source-over'; bctx.clearRect(0, 0, W, H); bctx.filter = 'blur(22px)'; bctx.drawImage(r.domElement, 0, 0); bctx.filter = 'none';
  bctx.globalCompositeOperation = 'destination-out';
  const g = bctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1000); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.5, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H); out.drawImage(blurC, 0, 0);
};
window.seek(0); window.__ready = true;
</script>
