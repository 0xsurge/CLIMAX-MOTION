<title>Sterling v3</title>
<!-- Sterling v3, "The claim and the check". 1920x1080, ~30.4 s, cut to Thunder (drop at 1.9 s, beat 0.625653 s).
     window.seek(t) paints frame t. Layers: (1) a continuous three.js chrome world with a travelling gradient light,
     defocused at the edges; (2) tilted 3D cards (three.js planes with canvas textures); (3) DOM type, cursor, logo,
     2D transforms only. Chapter change = luma gradient sweep (shader). Springs only (lib motion.js), no state between frames. -->
