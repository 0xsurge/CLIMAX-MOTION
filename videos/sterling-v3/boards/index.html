<!doctype html>
<meta charset="utf-8">
<title>Sterling v3 storyboard frames</title>
<!-- Key frames for the Sterling v3 film (launch-style). 1920x1080. window.seek(n) shows panel n. Rendered to stills.
     Frames show the pose at that beat; motion is described in the storyboard page. Tilted planes use CSS 3D here
     only as a still mock; the film builds them as three.js planes. -->
<style>
  @font-face { font-family: 'Z'; src: url(../assets/zalando.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: 'P'; src: url(../assets/public.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: #030404; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #030404; color: #fff; font-family: 'Z', sans-serif; }
  .pn { position: absolute; inset: 0; display: none; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .row { position: absolute; left: 0; width: 1920px; display: flex; justify-content: center; align-items: baseline; gap: .26em; white-space: nowrap; }
  .cap { font: 500 66px/1 'Z'; letter-spacing: -.02em; }
  .slam { font: 500 300px/1 'Z'; letter-spacing: -.05em; }
  .claim { background: linear-gradient(100deg, #FF3D12, #FF8A1F 55%, #FFC46B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ver { background: linear-gradient(100deg, #0FBF7A, #3DFFB0 60%, #D8FF7A); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .blurw { filter: blur(9px); transform: translateX(34px); opacity: .55; display: inline-block; }
  .ghost { position: absolute; left: 0; width: 1920px; display: flex; justify-content: center; white-space: nowrap; }
  .smearR { text-shadow: -40px 0 18px rgba(255,90,31,.55), -90px 0 30px rgba(255,61,18,.35), -150px 0 40px rgba(255,61,18,.2); }
  .smearG { text-shadow: -40px 0 18px rgba(61,255,176,.5), -90px 0 30px rgba(15,191,122,.35), -150px 0 40px rgba(15,191,122,.2); }
  .card { position: absolute; background: #121414; border-radius: 26px; box-shadow: 0 40px 90px rgba(0,0,0,.6), inset 0 0 0 1.5px rgba(255,255,255,.06); font-family: 'P', sans-serif; }
  .rim { position: absolute; left: 30px; right: 30px; top: 0; height: 2px; background: linear-gradient(90deg, transparent, #3DFFB0, transparent); filter: blur(.5px); }
  .mono { font-family: ui-monospace, 'DejaVu Sans Mono', monospace; }
  .lab { font: 600 22px/1 'P'; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .btn { position: absolute; border-radius: 18px; font: 600 34px/1 'P'; display: flex; align-items: center; justify-content: center; }
  .bloom { box-shadow: 0 0 0 2px #3DFFB0, 0 0 40px rgba(61,255,176,.55), 0 0 90px rgba(61,255,176,.25); }
  .dart { position: absolute; width: 92px; height: 100px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
  .chk { display: inline-block; width: 34px; height: 35px; vertical-align: -6px; }
</style>
<div id="stage"></div>
<script>
const $ = document.getElementById('stage'), A = '../assets/';
const DART = (x, y, s = 1, fill = '#0B0C0D', stroke = '#fff') => `<svg class="dart" style="left:${x}px;top:${y}px;transform:scale(${s});transform-origin:0 0" viewBox="0 0 46 50"><path d="M4 4 L42 20 L24 25 L18 44 Z" fill="${fill}" stroke="${stroke}" stroke-width="4.2" stroke-linejoin="round"/></svg>`;
const CHK = c => `<svg class="chk" viewBox="82.5 188 51.3 52.6"><path d="M84.5347 209.479L99.1184 223.369L131.758 190.034V206.007L99.8128 238.647L84.5347 224.063V209.479Z" fill="${c}"/><path d="M85.2292 191.424H101.202V197.674H85.2292V191.424Z" fill="${c}"/></svg>`;
const bg = (f, extra = '') => `<div class="bg" style="background-image:url(${A}${f});${extra}"></div><div class="bg" style="background:radial-gradient(ellipse 46% 30% at 50% 50%, rgba(3,4,4,.88), rgba(3,4,4,.55) 60%, rgba(3,4,4,0))"></div>`;
const P = [
  // 1 hook: problem line building word by word on the claim ground
  () => bg('claimR0.png') + `<div class="row cap" style="top:500px">A model name on an <span class="blurw">API</span></div>`,
  // 2 drop: the slam
  () => bg('claimC6.png') + `<div class="row cap" style="top:300px;opacity:.9">is a</div>
     <div class="ghost slam claim" style="top:430px;transform:scale(1.12);filter:blur(14px);opacity:.35">claim.</div>
     <div class="row slam claim" style="top:430px">claim.</div>`,
  // 3 doubt: word swap with a red-orange smear
  () => bg('claimL2.png') + `<div class="row cap" style="top:500px">Is it really <span class="claim smearR" style="display:inline-block;min-width:330px">Claude?</span></div>
     <div class="ghost cap" style="top:430px;opacity:.18;filter:blur(3px);transform:translateX(180px)">GPT?</div><div class="ghost cap" style="top:570px;opacity:.12;filter:blur(5px);transform:translateX(200px)">Gemini?</div>`,
  // 4 turn: the colour sweep floods the frame, the turn line rides it
  () => bg('sw_0.45.png') + `<div class="row cap" style="top:500px">Time to <span class="ver">check</span> it.</div>`,
  // 5 the Sterling mark slams in over the verified ground
  () => bg('verC1.png') + `<img src="${A}sterling-mark-white.svg" style="position:absolute;left:760px;top:240px;width:400px;filter:blur(16px);opacity:.4;transform:scale(1.25)">
     <img src="${A}sterling-mark-white.svg" style="position:absolute;left:785px;top:265px;width:350px">`,
  // 6 logo build: the wordmark assembles from scattered letters
  () => bg('verR0.png') + `<img src="${A}sterling-mark-white.svg" style="position:absolute;left:560px;top:470px;width:130px">
     ${['S','t','e','r','l','i','n','g'].map((ch, i) => { const dx = [0, 250, -40, 300, 90, 360, 160, 420][i], dy = [-170, 120, 190, -120, 60, -200, 160, -40][i], done = i < 3;
       return `<div style="position:absolute;left:${730 + i * 78 + (done ? 0 : dx)}px;top:${468 + (done ? 0 : dy)}px;font:500 128px/1 'Z';letter-spacing:-.03em;${done ? '' : 'filter:blur(4px);opacity:.75'}">${ch}</div>`; }).join('')}`,
  // 7 promise: one key, every model; the key card on a tilted plane, cursor pressing Copy
  () => bg('verL3.png', 'filter:brightness(.8)') + `<div class="row cap" style="top:200px">One key. <span class="ver">Every model.</span></div>
     <div style="position:absolute;left:330px;top:390px;width:1260px;height:520px;perspective:1600px">
       <div class="card" style="inset:0;transform:rotateX(24deg) rotateZ(-4deg);transform-origin:50% 100%">
         <div class="rim"></div>
         <div class="lab" style="position:absolute;left:70px;top:70px">Your Sterling key</div>
         <div class="mono" style="position:absolute;left:70px;top:140px;font-size:54px;color:#E8F2EE;letter-spacing:.06em">••••••••••••••••••••</div>
         <div class="btn bloom" style="left:880px;top:118px;width:300px;height:104px;background:#0FBF7A;color:#03140D">Copy</div>
         <div style="position:absolute;left:70px;top:300px;font:500 30px/1.5 'P';color:rgba(255,255,255,.5)">One key for Claude, GPT, Gemini and more.</div>
       </div></div>${DART(1300, 560, 1.15)}`,
  // 8 the endpoint typed big, camera tracking the caret
  () => bg('verR0.png', 'filter:brightness(.55)') + `<div class="row cap" style="top:250px">Change the endpoint.</div>
     <div class="card" style="left:120px;top:420px;width:1680px;height:240px;transform:scale(1.04)"><div class="rim"></div>
       <div class="mono" style="position:absolute;left:70px;top:82px;font-size:66px;color:#9AA39E;white-space:nowrap">base_url = <span style="color:#3DFFB0">"https://sterling.mira.net</span><span style="display:inline-block;width:6px;height:70px;background:#3DFFB0;vertical-align:-12px"></span></div></div>
     <div class="row cap" style="top:780px;opacity:.55;font-size:40px">Keep your workflow.</div>`,
  // 9 routing: providers checked, the unverified one skipped
  () => bg('verC1.png', 'filter:brightness(.6)') + `<div class="row cap" style="top:150px">Routed only to <span class="ver">verified</span> providers.</div>
     <div style="position:absolute;left:420px;top:300px;width:1080px;height:640px;perspective:1700px">
       <div class="card" style="inset:0;transform:rotateY(-18deg) rotateX(10deg)"><div class="rim"></div>
       ${[['Provider 1', 1], ['Provider 2', 1], ['Provider 3', 0], ['Provider 4', 1]].map(([n, ok], i) => `<div style="position:absolute;left:60px;right:60px;top:${70 + i * 135}px;height:104px;border-radius:18px;background:${ok ? '#161A19' : '#1A1210'};display:flex;align-items:center;justify-content:space-between;padding:0 40px;font:500 36px/1 'P';color:${ok ? '#E8F2EE' : 'rgba(255,255,255,.35)'};${i === 1 ? 'box-shadow:0 0 0 2px #3DFFB0,0 0 40px rgba(61,255,176,.4)' : ''}">
         <span>${n} · claude-sonnet-5-5</span><span style="font:600 26px 'P';color:${ok ? '#3DFFB0' : '#FF6A3D'}">${ok ? CHK('#3DFFB0') + ' verified' : 'not verified · skipped'}</span></div>`).join('')}
       </div></div>`,
  // 10 the five checks as a word swap
  () => bg('verC1.png') + `<div class="row cap" style="top:500px">Checked for <span class="ver smearG" style="display:inline-block">model identity</span></div>
     <div class="ghost cap" style="top:420px;opacity:.15;filter:blur(3px);transform:translateX(250px)">tool calls</div><div class="ghost cap" style="top:585px;opacity:.1;filter:blur(5px);transform:translateX(280px)">parameters honoured</div>`,
  // 11 slam: verified
  () => bg('verR0.png') + `<div class="row cap" style="top:270px">The model you pay for.</div>
     <div class="ghost slam ver" style="top:410px;transform:scale(1.1);filter:blur(14px);opacity:.3">Verified.</div><div class="row slam ver" style="top:410px">Verified.</div>`,
  // 12 range: the response card stays put, the model inside swaps every 4 frames
  () => bg('verL3.png', 'filter:brightness(.7)') + `<div class="card" style="left:560px;top:250px;width:800px;height:520px"><div class="rim"></div>
       <div class="lab" style="position:absolute;left:60px;top:60px">Response</div>
       <div class="mono" style="position:absolute;left:60px;top:130px;font-size:44px;color:#9AA39E">"model":</div>
       <div class="mono" style="position:absolute;left:60px;top:200px;font-size:70px;color:#fff">"gemini"</div>
       <div class="mono" style="position:absolute;left:60px;top:200px;font-size:70px;color:#fff;opacity:.16;filter:blur(2px);transform:translateY(-70px)">"gpt"</div>
       <div class="mono" style="position:absolute;left:60px;top:200px;font-size:70px;color:#fff;opacity:.08;filter:blur(4px);transform:translateY(-140px)">"claude"</div>
       <div style="position:absolute;left:60px;top:360px;font:600 34px 'P';color:#3DFFB0">${CHK('#3DFFB0')} Verified provider</div></div>
     <div class="row cap" style="top:860px">One key. Every model.</div>`,
  // 13 three steps: the cursor presses each step on the beat
  () => bg('verR0.png', 'filter:brightness(.6)') + `<div class="row cap" style="top:200px">Three steps. <span class="ver">Then you're in.</span></div>
     <div class="btn" style="left:250px;top:470px;width:420px;height:130px;background:#161A19;color:rgba(255,255,255,.45);transform:scale(.9)">Create your key</div>
     <div class="btn bloom" style="left:750px;top:455px;width:420px;height:160px;background:#0FBF7A;color:#03140D;font-size:44px">Add credit</div>
     <div class="btn" style="left:1250px;top:470px;width:420px;height:130px;background:#161A19;color:rgba(255,255,255,.45);transform:scale(.9)">Plug into your app</div>
     ${DART(1010, 560, 1.2)}<div class="row" style="top:700px;font:500 30px 'P';color:rgba(255,255,255,.5)">USDC or MIRA. Pay as you go.</div>`,
  // 14 the ending
  () => bg('verR0.png', 'filter:brightness(.5)') + `<div style="position:absolute;left:0;width:1920px;top:390px;display:flex;justify-content:center;align-items:flex-start;gap:38px">
       <img src="${A}sterling-mark-white.svg" style="width:120px"><img src="${A}sterling-word.svg" style="height:130px;filter:invert(1)"></div>
     <div class="row cap" style="top:600px;font-size:44px;opacity:.6">Verified inference.</div>
     <div style="position:absolute;left:760px;top:720px;width:400px;height:70px;border-radius:35px;display:flex;align-items:center;justify-content:center;font:500 30px 'P';color:#E8F2EE;background:#0D1010;box-shadow:inset 0 0 0 2px rgba(61,255,176,.6)">sterling.mira.network</div>
     <img src="${A}poweredby.svg" style="position:absolute;left:840px;top:850px;width:240px;filter:invert(1);opacity:.55">`,
];
const PANELS = P.map(f => { const d = document.createElement('div'); d.className = 'pn'; d.innerHTML = f(); $.appendChild(d); return d; });
window.seek = n => { PANELS.forEach((d, i) => { d.style.display = i === Math.round(n) - 1 ? 'block' : 'none'; }); };
Promise.all([document.fonts.load("500 60px 'Z'"), document.fonts.load("500 30px 'P'"), ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => { window.seek(1); window.__ready = true; });
</script>
