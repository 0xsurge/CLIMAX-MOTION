<!doctype html>
<meta charset="utf-8">
<title>three.js in the window.seek engine</title>
<!-- Example: real 3D inside a window.seek(t) film. A gold DRIP drop rises and turns beside a glass key, lit by a studio environment;
     a DOM wordmark rises over the canvas. Every value is a spring of t; one render per seek; nothing animates on its own. -->
<style>
  html, body { margin: 0; background: #EFE6D6; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #word { position: absolute; z-index: 1; left: 0; top: 860px; width: 1920px; height: 60px; overflow: hidden; display: flex; justify-content: center; }
  #word span { display: block; font: 600 40px/60px system-ui, sans-serif; letter-spacing: .3em; padding-left: .3em; color: #121214; }
</style>
<div id="stage"><div id="word"><span>DRIP VERSE</span></div></div>
<script type="importmap">
  { "imports": { "three": "../../engine/lib/three/three.module.js", "three/addons/": "../../engine/lib/three/addons/" } }
</script>
<script src="../../engine/lib/motion.js"></script>
<script type="module">
  import { createStage } from '../../engine/lib/three-stage.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
  const { spring, track } = Motion;
  const S = (t, t0, p = 'default') => spring(t - t0, p);
  const GLIDE = { k: 18, c: 8.5 };

  const st = await createStage({ parent: document.getElementById('stage') });
  const { THREE, scene, camera } = st;

  // set: a floor that dissolves into fog of the background colour, a warm key light with soft shadows
  scene.fog = new THREE.Fog('#EFE6D6', 7, 16);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#EFE6D6', roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const key = new THREE.SpotLight('#FFE2B8', 140, 0, 0.55, 0.9); key.position.set(-4, 7, 5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; scene.add(key);
  scene.add(new THREE.AmbientLight('#FFF4E4', 0.3));
  const pass = new THREE.PointLight('#FFC46A', 0, 9, 2); scene.add(pass);   // the moving gold light

  // the drop: an extruded, bevelled shape in polished gold
  const s = new THREE.Shape();
  s.moveTo(0, 0.5); s.bezierCurveTo(-0.06, 0.24, -0.26, 0.06, -0.26, -0.12); s.absarc(0, -0.12, 0.26, Math.PI, 0, false); s.bezierCurveTo(0.26, 0.06, 0.06, 0.24, 0, 0.5);
  const dg = new THREE.ExtrudeGeometry(s, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 10, curveSegments: 48 }); dg.center();
  const drop = new THREE.Mesh(dg, new THREE.MeshPhysicalMaterial({ color: '#C9A15C', metalness: 1, roughness: 0.18, clearcoat: 0.6 }));
  drop.castShadow = true; scene.add(drop);

  // the glass key
  const glass = new THREE.Mesh(new RoundedBoxGeometry(1, 0.42, 1, 8, 0.16), new THREE.MeshPhysicalMaterial({ transmission: 1, thickness: 0.25, roughness: 0.04, ior: 1.3, color: '#FFFFFF', clearcoat: 1 }));
  glass.position.set(1.35, 0.21, 0.4); glass.rotation.y = -0.4; glass.castShadow = true; scene.add(glass);

  const word = document.querySelector('#word span');

  window.seek = t => {
    // camera: spring keys plus a sway that returns to centre
    const cx = track(t, [{ t: 0, v: -2.6 }, { t: 0, v: 0.2, spring: GLIDE }, { t: 2.2, v: 0.45, spring: GLIDE }]);
    const cz = track(t, [{ t: 0, v: 6.8 }, { t: 0, v: 5.2, spring: GLIDE }, { t: 2.2, v: 5.8, spring: GLIDE }]);
    camera.position.set(cx + 0.06 * Math.sin(t * 1.1), 1.7 + 0.03 * Math.sin(t * 1.5 + 1), cz);
    camera.lookAt(0.45, 0.75, 0);
    // drop: rises from the floor on a heavy spring, turns to face the camera, keeps a small float
    const rise = S(t, 0.25, 'heavy');
    drop.position.set(0, 0.05 + 0.85 * rise + 0.03 * Math.sin(t * 1.6) * rise, 0);
    drop.rotation.set(0, track(t, [{ t: 0, v: -1.6 }, { t: 0.25, v: 0.35, spring: GLIDE }, { t: 2.0, v: -0.25, spring: GLIDE }]), 0.08 * Math.sin(t * 0.9));
    drop.scale.setScalar(0.4 + 0.6 * rise);
    // the gold light passes across the set once and dies away
    const b = Math.max(0, S(t, 1.0, 'snappy') - S(t, 1.9, { k: 120, c: 20 }));
    pass.intensity = 60 * b; pass.position.set(-4 + 8 * S(t, 1.0, { k: 10, c: 6 }), 2, 2.5);
    // DOM type over the canvas: a masked rise
    word.style.transform = `translateY(${(1 - S(t, 2.3, 'heavy')) * 66}px)`;
    st.render();
  };
  window.seek(0);
  window.__ready = true;
</script>
